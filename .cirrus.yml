freebsd_instance:
  image: freebsd-15-0-release-amd64
  cpu: 4

env:
  MAKE_FLAGS: -j 4

task:
  install_script:
    - sed -i.bak -e 's,pkg+http://pkg.FreeBSD.org/\${ABI}/quarterly,pkg+http://pkg.FreeBSD.org/\${ABI}/latest,' /etc/pkg/FreeBSD.conf
    - ASSUME_ALWAYS_YES=yes pkg bootstrap -f
    - pkg install -y gmp mpfr boost-libs cmake ninja py311-pytest py311-pip py311-wheel

  build_script:
    - fetch "https://github.com/CGAL/cgal/releases/download/v6.1.1/CGAL-6.1.1.tar.xz" -o CGAL-6.1.1.tar.xz
    - fetch "https://gitlab.com/SFCGAL/SFCGAL/-/archive/master/SFCGAL-master.tar.gz" -o SFCGAL.tar.gz
    - tar xzf SFCGAL.tar.gz
    - cd SFCGAL-master  
    - tar xJf ../CGAL-6.1.1.tar.xz
    - cmake -GNinja -S . -B build -DCGAL_DIR=CGAL-6.1.1
    - cmake --build build
    - cmake --install build
    - cd ..  
    - env CFLAGS=-I/usr/local/include LDFLAGS=-L/usr/local/lib pip3.11 -e .
    - ls tests/test_* | xargs pytest-3.11
